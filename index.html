<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة الشركات - الإسكندرية</title>
<style>
:root{--blue:#123c9b;--blue2:#0a286b;--yellow:#f7c900;--bg:#f4f7fc;--card:#fff;--text:#172033;--muted:#718096;--border:#e5eaf2;--green:#16a36a;--red:#d94444;--orange:#dc8b20}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#061535,#123c9b);padding:20px}
.loginbox{width:min(430px,100%);background:#fff;border-radius:24px;padding:35px;box-shadow:0 25px 70px #0005;text-align:center}
.loginbox img{width:170px;height:170px;object-fit:contain;margin-bottom:10px}
.loginbox h1{font-size:22px;margin:8px 0}.loginbox p{color:var(--muted);font-size:13px}
.loginbox input{width:100%;padding:13px;margin:7px 0;border:1px solid var(--border);border-radius:10px;outline:none}
.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff}.yellow{background:var(--yellow);color:#111}.light{background:#f3f6fa;color:var(--text);border:1px solid var(--border)}.danger{background:#fdecec;color:var(--red)}
.loginbox .btn{width:100%;margin-top:10px}
.app{min-height:100vh;display:flex}.side{width:270px;background:#0b1833;color:#fff;position:fixed;right:0;top:0;bottom:0;padding:18px 15px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 20px;border-bottom:1px solid #ffffff18}.brand img{width:55px;height:55px;object-fit:contain}.brand b{font-size:15px}.brand small{display:block;color:#aebbd1;font-size:10px;margin-top:4px}
.nav{padding-top:15px}.nav button{width:100%;background:transparent;border:0;color:#c9d3e4;text-align:right;padding:13px;border-radius:10px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#18315d;color:#fff}.user{position:absolute;bottom:18px;left:15px;right:15px;background:#132747;border-radius:12px;padding:12px;font-size:12px}.user b{display:block}.logout{float:left;color:#ffd42a;cursor:pointer}
.main{margin-right:270px;width:calc(100% - 270px);padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:24px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:0 8px 25px #203b6610}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:27px;margin-top:8px}
.section{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:20px;box-shadow:0 8px 25px #203b6608}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.tile{padding:17px;border:1px solid var(--border);border-radius:12px;background:#f9fbfe;cursor:pointer}.tile:hover{border-color:#9bb8ee;background:#f1f6ff}.tile b{display:block}.tile small{display:block;color:var(--muted);margin-top:6px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;border-bottom:1px solid var(--border);text-align:right;font-size:13px}.table th{background:#f8fafc;color:#5e6b80}.badge{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}.green{background:#e8f8ef;color:var(--green)}.orange{background:#fff4e4;color:var(--orange)}.red{background:#fdecec;color:var(--red)}.blue{background:#eaf1ff;color:var(--blue)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--border);border-radius:9px;background:#fff}
.modal{position:fixed;inset:0;background:#07142c99;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal.show{display:flex}.modalbox{width:min(650px,100%);background:#fff;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form input,.form select{padding:11px;border:1px solid var(--border);border-radius:9px}.full{grid-column:1/-1}.close{float:left;border:0;background:#f1f4f8;padding:7px 10px;border-radius:8px;cursor:pointer}
.chart{display:grid;gap:13px}.barrow{display:grid;grid-template-columns:130px 1fr 55px;align-items:center;gap:10px;font-size:12px}.bar{height:14px;background:#edf1f7;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:20px}.note{padding:13px;background:#fff8d8;border-right:4px solid var(--yellow);border-radius:8px;font-size:12px}
@media(max-width:950px){.side{width:220px}.main{margin-right:220px;width:calc(100% - 220px)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{position:static;width:100%;height:auto}.user{position:static;margin-top:15px}.main{margin:0;width:100%;padding:14px}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <img src="logo.jpg.png" alt="لوجو">
    <h1>لوحة إدارة الشركات</h1>
    <p>الإسكندرية — نظام إدارة الزيارات والبيانات</p>
    <input id="loginUser" placeholder="اسم المستخدم" value="admin">
    <input id="loginPass" type="password" placeholder="كلمة المرور" value="1234">
    <button class="btn primary" onclick="login()">تسجيل الدخول</button>
    <div id="loginMsg" style="color:#d94444;font-size:12px;margin-top:10px"></div>
  </div>
</div>

<div id="app" class="app hidden">
<aside class="side">
 <div class="brand"><img src="logo.jpg.png"><div><b>Alexandria CRM</b><small>إدارة المناطق والشركات</small></div></div>
 <div class="nav">
  <button class="active" onclick="page('home',this)">🏠 الرئيسية</button>
  <button onclick="page('areas',this)">📍 إدارة المناطق</button>
  <button onclick="page('companies',this)">🏢 الشركات</button>
  <button onclick="page('employees',this)">👥 الموظفين</button>
  <button onclick="page('analytics',this)">📊 تحليل البيانات</button>
 </div>
 <div class="user"><span class="logout" onclick="logout()">خروج</span>المستخدم الحالي<b id="currentUser">مدير النظام</b></div>
</aside>
<main class="main">
 <div class="top"><div><h1 id="pageTitle">الرئيسية</h1><p id="pageSub">نظرة سريعة على قاعدة بيانات الإسكندرية</p></div><button class="btn yellow" onclick="openCompany()">+ إضافة شركة</button></div>
 <div id="content"></div>
</main>
</div>

<div class="modal" id="modal">
 <div class="modalbox"><button class="close" onclick="closeModal()">✕</button><h2 id="modalTitle">إضافة</h2><div id="modalContent"></div></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby-xjZBK2X7xKgaie3GKxU0warOH3xPInNqPsayNRjP-VCncWOqlx3S7M3CBL4MG5lQ4w/exec';
let googleSheetsMode = false;

async function loadFromGoogleSheets() {
  if (!API_URL) return false;
  try {
    const res = await fetch(API_URL + '?action=all');
    const data = await res.json();
    if (data.companies) companies = data.companies.map(c => ({
      id:String(c.ID), name:String(c['اسم الشركة']||''), activity:String(c['النشاط']||''),
      manager:String(c['المدير']||''), phone:String(c['الهاتف']||''), district:String(c['الحي']||''),
      area:String(c['المنطقة']||''), status:String(c['الحالة']||'لم يتم التواصل')
    }));
    if (data.areas && data.areas.length) {
      areas = {};
      data.areas.forEach(r => {
        const d=String(r['الحي']||''), a=String(r['المنطقة']||'');
        if(d){ if(!areas[d]) areas[d]=[]; if(a && !areas[d].includes(a)) areas[d].push(a); }
      });
    }
    if (data.employees) employees = data.employees.map(e => ({
      id:String(e.ID), name:String(e['اسم الموظف']||''), role:String(e['الدور']||''),
      phone:String(e['الهاتف']||''), user:String(e['اسم المستخدم']||''), status:String(e['الحالة']||'نشط')
    }));
    save();
    googleSheetsMode = true;
    return true;
  } catch(err) {
    console.warn('Google Sheets غير متاح، سيتم استخدام البيانات المحلية.', err);
    return false;
  }
}

function syncPost(params) {
  if (!API_URL) return;
  const form = document.createElement('form');
  form.method='POST'; form.action=API_URL; form.target='googleSyncFrame';
  Object.entries(params).forEach(([k,v]) => {
    const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=v ?? ''; form.appendChild(i);
  });
  document.body.appendChild(form); form.submit(); setTimeout(()=>form.remove(),1500);
}
function syncCompany(c){
  syncPost({action:'saveCompany',id:c.id,name:c.name,activity:c.activity,manager:c.manager,phone:c.phone,district:c.district,area:c.area,status:c.status,notes:c.notes||'',lastFollowup:new Date().toISOString()});
}
function syncArea(id,district,area){ syncPost({action:'saveArea',id,district,area}); }
function syncEmployee(e){ syncPost({action:'saveEmployee',id:e.id,name:e.name,role:e.role,phone:e.phone,username:e.user,status:e.status||'نشط'}); }
const defaultAreas={
"شرق الإسكندرية":["سموحة","سيدي جابر","كليوباترا","جليم","فلمنج","لوران","رشدي","سان ستيفانو","ميامي"],
"وسط الإسكندرية":["محطة الرمل","المنشية","العطارين","محرم بك","الشاطبي","الأزاريطة","كامب شيزار"],
"العجمي":["البيطاش","الهانوفيل","أبو يوسف","الدخيلة","العجمي"],
"المنتزه":["المندرة","العصافرة","ميامي","سيدي بشر","أبو قير","المعمورة"],
"العامرية":["العامرية","مرغم","الناصرية","الكينج مريوط"],
"برج العرب":["برج العرب الجديدة","برج العرب القديمة","المنطقة الصناعية الأولى","المنطقة الصناعية الثانية"],
"غرب الإسكندرية":["الورديان","كرموز","غيط العنب","مينا البصل","القباري"],
"الجمرك":["الجمرك","بحري","رأس التين","الأنفوشي"]
};
let areas=JSON.parse(localStorage.getItem("alexAreas")||"null")||defaultAreas;
let companies=JSON.parse(localStorage.getItem("alexCompanies")||"[]");
let employees=JSON.parse(localStorage.getItem("alexEmployees")||"[]");
if(!companies.length) companies=[
{id:1,name:"شركة الإسكندرية للنقل",activity:"نقل ولوجستيات",phone:"01000000001",manager:"أحمد محمد",district:"العجمي",area:"الهانوفيل",status:"تم التواصل"},
{id:2,name:"شركة النور للتجارة",activity:"تجارة وتوريدات",phone:"01000000002",manager:"محمد علي",district:"العجمي",area:"البيطاش",status:"تحت التفاوض"},
{id:3,name:"Alex Logistics",activity:"شحن ولوجستيات",phone:"01000000003",manager:"محمود حسن",district:"شرق الإسكندرية",area:"سموحة",status:"لم يتم التواصل"}
];
const save=()=>{localStorage.setItem("alexAreas",JSON.stringify(areas));localStorage.setItem("alexCompanies",JSON.stringify(companies));localStorage.setItem("alexEmployees",JSON.stringify(employees))};
function login(){if(loginUser.value==="admin"&&loginPass.value==="1234"){sessionStorage.logged="1";showApp()}else loginMsg.textContent="بيانات الدخول غير صحيحة"}
function showApp(){login.classList.add("hidden");app.classList.remove("hidden");page("home")}
function logout(){sessionStorage.clear();location.reload()}
if(sessionStorage.logged)showApp();
function page(name,el){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active");({home:home,areas:manageAreas,companies:manageCompanies,employees:manageEmployees,analytics:analytics})[name]()}
function title(t,s){pageTitle.textContent=t;pageSub.textContent=s}
function home(){title("الرئيسية","نظرة سريعة على قاعدة البيانات");let total=companies.length,done=companies.filter(x=>x.status==="تم التواصل"||x.status==="تمت الزيارة").length,pending=companies.filter(x=>x.status==="تحت التفاوض").length,no=companies.filter(x=>x.status==="لم يتم التواصل").length;content.innerHTML=`<div class="cards"><div class="stat">🏢<span>إجمالي الشركات</span><b>${total}</b></div><div class="stat">📞<span>تم التواصل</span><b>${done}</b></div><div class="stat">⏳<span>تحت التفاوض</span><b>${pending}</b></div><div class="stat">🔴<span>لم يتم التواصل</span><b>${no}</b></div></div><div class="section"><div class="sectionhead"><h2>الأحياء</h2><button class="btn primary" onclick="manageAreas()">إدارة الأحياء</button></div><div class="grid">${Object.keys(areas).map(d=>`<div class="tile" onclick="areaDetails('${d}')"><b>📍 ${d}</b><small>${areas[d].length} منطقة</small></div>`).join("")}</div></div><div class="section"><div class="note">💡 أنت المتحكم في البيانات: يمكنك إضافة وحذف الأحياء والمناطق، إضافة الموظفين، وتغيير حالة كل شركة ومتابعة النتائج من التحليلات.</div></div>`}
function manageAreas(){title("إدارة المناطق","أضف أو احذف الأحياء والمناطق بنفسك");content.innerHTML=`<div class="section"><div class="sectionhead"><h2>الأحياء الرئيسية</h2><button class="btn primary" onclick="addDistrict()">+ إضافة حي</button></div><div class="grid">${Object.keys(areas).map(d=>`<div class="tile"><b>📍 ${d}</b><small>${areas[d].length} منطقة</small><div class="toolbar" style="margin-top:10px"><button class="btn light" onclick="areaDetails('${d}')">فتح</button><button class="btn danger" onclick="deleteDistrict('${d}')">حذف</button></div></div>`).join("")}</div></div>`}
function areaDetails(d){title(d,"إدارة مناطق الحي");content.innerHTML=`<div class="section"><div class="sectionhead"><h2>مناطق ${d}</h2><div class="toolbar"><button class="btn primary" onclick="addArea('${d}')">+ إضافة منطقة</button><button class="btn light" onclick="manageAreas()">رجوع</button></div></div><div class="grid">${areas[d].map(a=>`<div class="tile"><b>📌 ${a}</b><small>${companies.filter(c=>c.district===d&&c.area===a).length} شركة</small><div class="toolbar" style="margin-top:10px"><button class="btn light" onclick="areaCompanies('${d}','${a}')">الشركات</button><button class="btn danger" onclick="deleteArea('${d}','${a}')">حذف</button></div></div>`).join("")}</div></div>`}
function manageCompanies(){title("الشركات","بيانات الشركات تظهر عند فتح الشركة فقط");content.innerHTML=`<div class="section"><div class="toolbar"><input id="companySearch" placeholder="بحث باسم الشركة..." oninput="renderCompanyTable()"><select id="statusFilter" onchange="renderCompanyTable()"><option value="">كل الحالات</option><option>لم يتم التواصل</option><option>تم التواصل</option><option>تحت التفاوض</option><option>تم الاتفاق</option><option>تمت الزيارة</option><option>رفض</option></select><button class="btn primary" onclick="openCompany()">+ إضافة شركة</button></div><div id="companyTable" style="margin-top:15px"></div></div>`;renderCompanyTable()}
function renderCompanyTable(){let q=(companySearch?.value||"").toLowerCase(),f=statusFilter?.value||"";let list=companies.filter(c=>(c.name.toLowerCase().includes(q)||c.area.toLowerCase().includes(q))&&(!f||c.status===f));companyTable.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>اسم الشركة</th><th>المنطقة</th><th>الحالة</th><th>إجراء</th></tr>${list.map(c=>`<tr><td><button class="btn light" onclick="companyDetails(${c.id})">${c.name}</button></td><td>${c.area}</td><td>${badge(c.status)}</td><td><button class="btn light" onclick="companyDetails(${c.id})">فتح البيانات</button></td></tr>`).join("")}</table></div>`}
function areaCompanies(d,a){let list=companies.filter(c=>c.district===d&&c.area===a);title(a,`شركات منطقة ${d}`);content.innerHTML=`<div class="section"><div class="sectionhead"><h2>الشركات</h2><button class="btn primary" onclick="openCompany('${d}','${a}')">+ إضافة شركة</button></div><div class="grid">${list.map(c=>`<div class="tile" onclick="companyDetails(${c.id})"><b>🏢 ${c.name}</b><small>${badge(c.status)}</small></div>`).join("")||"<div>لا توجد شركات بعد.</div>"}</div></div>`}
function companyDetails(id){let c=companies.find(x=>x.id===id);title(c.name,"بيانات الشركة");content.innerHTML=`<div class="section"><div class="sectionhead"><h2>بيانات الشركة</h2><button class="btn light" onclick="manageCompanies()">رجوع</button></div><div class="cards" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><span>النشاط</span><b style="font-size:16px">${c.activity||"-"}</b></div><div class="stat"><span>المدير / المسؤول</span><b style="font-size:16px">${c.manager||"-"}</b></div><div class="stat"><span>رقم التواصل</span><b style="font-size:16px">${c.phone||"-"}</b></div><div class="stat"><span>المكان</span><b style="font-size:16px">${c.district} / ${c.area}</b></div></div><div class="section" style="box-shadow:none;padding:0;border:0"><h3>حالة التواصل</h3><select onchange="changeStatus(${c.id},this.value)" style="padding:11px;border:1px solid var(--border);border-radius:9px">${["لم يتم التواصل","تم التواصل","تحت التفاوض","تم الاتفاق","تمت الزيارة","رفض"].map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select><div class="toolbar" style="margin-top:15px"><button class="btn primary" onclick="location.href='tel:${c.phone}'">📞 اتصال</button><button class="btn yellow" onclick="wa('${c.phone}')">💬 واتساب</button><button class="btn danger" onclick="deleteCompany(${c.id})">حذف الشركة</button></div></div></div>`}
function badge(s){let cl=s==="تم التواصل"||s==="تمت الزيارة"||s==="تم الاتفاق"?"green":s==="تحت التفاوض"?"orange":s==="رفض"?"red":"blue";return `<span class="badge ${cl}">${s}</span>`}
function changeStatus(id,s){let c=companies.find(x=>x.id===id);c.status=s;save();syncCompany(c);companyDetails(id)}
function deleteCompany(id){if(confirm("حذف الشركة؟")){companies=companies.filter(x=>x.id!==id);save();manageCompanies()}}
function addDistrict(){let n=prompt("اسم الحي الجديد:");if(n&&!areas[n]){areas[n]=[];save();manageAreas()}}
function deleteDistrict(d){if(confirm(`حذف حي ${d} وكل مناطقه من القائمة؟`)){delete areas[d];save();manageAreas()}}
function addArea(d){let n=prompt(`إضافة منطقة داخل ${d}:`);if(n&&!areas[d].includes(n)){areas[d].push(n);save();syncArea(Date.now(),d,n);areaDetails(d)}}
function deleteArea(d,a){if(confirm(`حذف منطقة ${a}؟`)){areas[d]=areas[d].filter(x=>x!==a);save();areaDetails(d)}}
function openCompany(d="",a=""){openModal();modalTitle.textContent="إضافة شركة";modalContent.innerHTML=`<form class="form" onsubmit="saveCompany(event)"><input id="cn" required placeholder="اسم الشركة"><input id="ca" placeholder="النشاط"><input id="cp" placeholder="رقم التواصل"><input id="cm" placeholder="اسم المدير"><select id="cd">${Object.keys(areas).map(x=>`<option ${x===d?"selected":""}>${x}</option>`).join("")}</select><input id="cr" value="${a}" placeholder="المنطقة"><select id="cs"><option>لم يتم التواصل</option><option>تم التواصل</option><option>تحت التفاوض</option><option>تم الاتفاق</option><option>تمت الزيارة</option><option>رفض</option></select><div class="full"><button class="btn primary">حفظ الشركة</button></div></form>`}
function saveCompany(e){e.preventDefault();const c={id:Date.now(),name:cn.value,activity:ca.value,phone:cp.value,manager:cm.value,district:cd.value,area:cr.value,status:cs.value};companies.push(c);save();syncCompany(c);closeModal();manageCompanies()}
function manageEmployees(){title("الموظفين","إضافة الموظفين وتحديد دور كل موظف");content.innerHTML=`<div class="section"><div class="sectionhead"><h2>فريق العمل</h2><button class="btn primary" onclick="addEmployee()">+ إضافة موظف</button></div><div class="tablewrap"><table class="table"><tr><th>الاسم</th><th>الدور</th><th>الهاتف</th><th>الإجراء</th></tr>${employees.map((e,i)=>`<tr><td>${e.name}</td><td>${e.role}</td><td>${e.phone||"-"}</td><td><button class="btn danger" onclick="delEmployee(${i})">حذف</button></td></tr>`).join("")}</table></div></div>`}
function addEmployee(){openModal();modalTitle.textContent="إضافة موظف";modalContent.innerHTML=`<form class="form" onsubmit="saveEmployee(event)"><input id="en" required placeholder="اسم الموظف"><input id="er" placeholder="الدور / الصلاحية"><input id="ep" placeholder="رقم الهاتف"><input id="eu" placeholder="اسم المستخدم"><input id="ek" placeholder="كلمة المرور"><div class="full"><button class="btn primary">إضافة الموظف</button></div></form>`}
function saveEmployee(e){e.preventDefault();const e={id:Date.now(),name:en.value,role:er.value||"موظف",phone:ep.value,user:eu.value,status:'نشط'};employees.push(e);save();syncEmployee(e);closeModal();manageEmployees()}
function delEmployee(i){if(confirm("حذف الموظف؟")){employees.splice(i,1);save();manageEmployees()}}
function analytics(){title("تحليل البيانات","مؤشرات تساعدك تعرف أين تركز الزيارات والمتابعة");let total=companies.length||1;let statuses=["لم يتم التواصل","تم التواصل","تحت التفاوض","تم الاتفاق","تمت الزيارة","رفض"];let max=Math.max(...statuses.map(s=>companies.filter(c=>c.status===s).length),1);let districtRows=Object.keys(areas).map(d=>({d,n:companies.filter(c=>c.district===d).length})).sort((a,b)=>b.n-a.n);content.innerHTML=`<div class="cards"><div class="stat"><span>نسبة التواصل</span><b>${Math.round((companies.filter(c=>c.status!=="لم يتم التواصل").length/total)*100)}%</b></div><div class="stat"><span>نسبة التفاوض</span><b>${Math.round((companies.filter(c=>c.status==="تحت التفاوض").length/total)*100)}%</b></div><div class="stat"><span>نسبة الاتفاق</span><b>${Math.round((companies.filter(c=>c.status==="تم الاتفاق").length/total)*100)}%</b></div><div class="stat"><span>أكبر حي من حيث الشركات</span><b style="font-size:16px">${districtRows[0]?.d||"-"}</b></div></div><div class="section"><h2>توزيع حالات الشركات</h2><div class="chart" style="margin-top:18px">${statuses.map(s=>{let n=companies.filter(c=>c.status===s).length;return `<div class="barrow"><span>${s}</span><div class="bar"><div class="fill" style="width:${n/max*100}%"></div></div><b>${n}</b></div>`}).join("")}</div></div><div class="section"><h2>الشركات حسب الحي</h2><div class="chart" style="margin-top:18px">${districtRows.map(x=>`<div class="barrow"><span>${x.d}</span><div class="bar"><div class="fill" style="width:${x.n/(districtRows[0]?.n||1)*100}%"></div></div><b>${x.n}</b></div>`).join("")}</div></div>`}
